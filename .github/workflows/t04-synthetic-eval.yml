name: T04 synthetic summary evaluation

on:
  push:
    branches:
      - codex/t04-gemini-summary
    paths:
      - ".github/workflows/t04-synthetic-eval.yml"
      - "scripts/t04_live_eval.py"
      - "scripts/diagnose_gemini.py"
      - "scripts/evaluate_ai_summaries.py"
      - "scripts/news_summaries.py"
      - "tests/fixtures/ai_summary_cases.json"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  synthetic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Evaluate synthetic summaries
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_SUMMARY_MODEL: gemini-3.5-flash-lite
        run: python scripts/t04_live_eval.py
