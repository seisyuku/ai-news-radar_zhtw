name: T04 synthetic summary evaluation

# GitHub requires a workflow_dispatch file on the default branch. The actual
# synthetic evaluator lives on codex/t04-gemini-summary and is selected by ref.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  registration-only:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Select codex/t04-gemini-summary to run the synthetic evaluator.'
