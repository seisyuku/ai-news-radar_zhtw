name: Offline tests

on:
  push:
    paths:
      - "scripts/**"
      - "tests/**"
      - "requirements*.txt"
      - "assets/**"
      - "index.html"
      - ".github/workflows/offline-tests.yml"
      - ".github/workflows/digest-generation.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "requirements*.txt"
      - "assets/**"
      - "index.html"
      - ".github/workflows/offline-tests.yml"
      - ".github/workflows/digest-generation.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements-dev.txt"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run offline Python tests
        # The Git-baseline asset check remains in asset-version.yml, which
        # supplies the correct push/PR comparison commit.
        run: |
          mkdir -p "$HOME/Downloads/ai-news-radar-offline-tests"
          python -m pytest -q -p no:cacheprovider --basetemp "$HOME/Downloads/ai-news-radar-offline-tests/pytest" -k "not test_asset_change_bumps_version_from_git_baseline"

      - name: Check JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/motion.js
          node --check assets/loader.js
          node --check assets/selection.js
