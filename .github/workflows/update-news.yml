name: Update AI News Snapshot

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Trigger source. 'heartbeat' is the only value with special handling - see the freshness-check job below."
        required: false
        default: "manual"
        type: string
  schedule:
    # GitHub drops (not just delays) a meaningful fraction of schedule
    # events during high load, and load peaks hardest exactly on the
    # hour/half-hour because that's where most repos' cron jobs land.
    # Offsetting off those round minutes cuts the drop rate, but does not
    # eliminate it - re-measured 2026-07-17 via `gh run list
    # --workflow=update-news.yml --json createdAt,event,conclusion` filtered
    # to event=schedule (only ~13.8h of run history survives an earlier
    # security-driven log cleanup, so this is the full available window, not
    # a sample): with the once-offset "7,37 * * * *" (nominal 30 min /
    # 48-a-day), the 10 schedule runs between 2026-07-16T11:19Z and
    # 2026-07-17T01:04Z produced 9 gaps with a 91.2 min median (P90 105 min,
    # max 134 min) - actual throughput ~17-18 runs/day vs the 48/day the
    # cron nominally implies, i.e. still a chronic ~2-3x under-delivery, not
    # a one-off incident. Moving to 4 ticks/hour (15 min nominal spacing)
    # trades more wasted ticks for a shorter worst-case gap under the same
    # drop rate; execution itself remains fast (all runs in this window
    # completed in under 2 minutes with none queued/stuck), so the ticks
    # themselves are still what's being dropped, not run execution.
    - cron: "7,22,37,52 * * * *"
    # 2026-07-17T05:47Z re-registration touch: this cron value shipped at
    # 03:12Z but produced zero schedule triggers in the ~2.5h since (vs. ~10
    # expected ticks), while workflow state=active, no queued/in_progress
    # runs stuck in the concurrency group, actionlint reports 0 issues on
    # this file, and githubstatus.com shows Actions fully operational - none
    # of the other failure modes apply. Touching the file again to force
    # GitHub to re-read the schedule definition.
    #
    # 2026-07-17T12:45Z second touch, same diagnosis repeated: schedule ticks
    # since the first touch had grown to 92-147 min gaps (vs. the ~91 min
    # baseline median), no queued/in_progress runs, workflow state=active,
    # and githubstatus.com's incident history shows nothing covering this
    # window (the one relevant incident, "Degraded REST API Availability",
    # ran 22:21-23:50 UTC on 07-16 and was long resolved). Ruled out every
    # external cause twice in one day - see watchdog.yml for the permanent
    # fix instead of relying on a third manual touch.
    #
    # 2026-07-19T06:08Z third touch: last schedule run 04:39:40Z, 88.6 min
    # gap at check time (just under the 90 min watchdog threshold, but
    # trending the same way as the prior two incidents); watchdog.yml's own
    # hourly tick was also stalled at a 147.7 min gap (last run 03:40:35Z),
    # so the safety net was not positioned to catch this even if the gap
    # crossed 90 min. Touching both workflow files together to force
    # re-registration of both schedule layers at once.

# Queue runs instead of cancelling: a schedule tick that starts while a
# manual dispatch (or a previous tick) is still pushing must wait its turn,
# not race it or kill it mid-push. cancel-in-progress: true previously let a
# newer trigger cancel an in-flight run partway through git push, which is
# how the concurrent-run race happened.
concurrency:
  group: update-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # External heartbeat backstop (2026-07-19): watchdog.yml's own hourly
  # `schedule` registration has been observed decaying independently of
  # update-news.yml's (a 147.7 min gap on 2026-07-19, over 2x its normal
  # cadence - see the watchdog.yml touch comment), so a two-layer defense
  # built entirely out of GitHub `schedule` triggers is not fully
  # independent of the platform-level failure mode both layers are trying
  # to protect against. An external cron service (cron-job.org, outside
  # GitHub's scheduler entirely) calls workflow_dispatch with
  # inputs.source=heartbeat every 30 min as a third, structurally
  # independent tick source - see docs/OPERATIONS.md "External heartbeat"
  # for the operator-facing setup.
  #
  # Heartbeat skips only when the publishing branch already has a fresh
  # generated snapshot. An Actions run can succeed while skipping the update,
  # so its timestamps do not indicate that the snapshot moved.
  freshness-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.guard.outputs.should_run }}
    steps:
      - name: Heartbeat freshness guard
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE: ${{ inputs.source || 'manual' }}
          FRESHNESS_THRESHOLD_MINUTES: 25
        run: |
          set -euo pipefail

          if [ "$SOURCE" != "heartbeat" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Trigger source is '$SOURCE' (not heartbeat) - running normally, no freshness check applies."
            exit 0
          fi

          # Use the generated timestamp in the committed daily snapshot. This
          # endpoint reads the publishing ref and does not depend on Pages cache.
          if ! last_generated_at=$(gh api \
              "repos/$GITHUB_REPOSITORY/contents/data/daily-brief.json" --method GET \
              -f "ref=$GITHUB_REF_NAME" -H 'Accept: application/vnd.github.raw+json' | \
              jq -er '.generated_at | strings | select(test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}([.][0-9]+)?Z$"))') ||
             ! last_epoch=$(date -u -d "$last_generated_at" +%s); then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not verify the last published snapshot. Running a refresh."
            exit 0
          fi

          now_epoch=$(date -u +%s)
          if [ "$last_epoch" -gt "$now_epoch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "::warning::The last published snapshot has a future timestamp. Running a refresh."
            exit 0
          fi
          age_minutes=$(( (now_epoch - last_epoch) / 60 ))

          if [ "$age_minutes" -lt "$FRESHNESS_THRESHOLD_MINUTES" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Published snapshot age: $age_minutes min (< $FRESHNESS_THRESHOLD_MINUTES min). Skipping the update job."
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Published snapshot age: $age_minutes min (threshold $FRESHNESS_THRESHOLD_MINUTES min). Running a refresh."
          fi

  update:
    needs: freshness-check
    if: needs.freshness-check.outputs.should_run == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare OPML
        env:
          FOLLOW_OPML_B64: ${{ secrets.FOLLOW_OPML_B64 }}
        run: |
          mkdir -p feeds
          if [ -n "$FOLLOW_OPML_B64" ]; then
            echo "$FOLLOW_OPML_B64" | base64 --decode > feeds/follow.opml
            echo "Loaded feeds/follow.opml from FOLLOW_OPML_B64 secret"
          elif [ -f feeds/follow.example.opml ]; then
            cp feeds/follow.example.opml feeds/follow.opml
            echo "Loaded public demo OPML from feeds/follow.example.opml"
          else
            echo "No OPML file available; RSS OPML is optional"
          fi

      - name: Remember generation base
        run: |
          base=$(git rev-parse --verify HEAD)
          echo "GENERATION_BASE=$base" >> "$GITHUB_ENV"

      - name: Update data
        env:
          RSS_MAX_FEEDS: ${{ vars.RSS_MAX_FEEDS || 10 }}
          # Optional cache-first news summaries. The site still updates when
          # the secret is absent or Groq is temporarily unavailable.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_SUMMARY_MODEL: ${{ vars.GROQ_SUMMARY_MODEL || 'qwen/qwen3.8-27b' }}
          GROQ_SUMMARY_MAX_NEW: ${{ vars.GROQ_SUMMARY_MAX_NEW || 6 }}
          # Optional, bounded reader translation. Missing credentials retain
          # the original English display text and never block the snapshot.
          # GEMINI_API_KEY is the canonical Secret name. The previous name is
          # accepted only to migrate an already-configured Gemini key without
          # exposing or copying its value.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_TRANSLATE_API_KEY }}
        run: |
          if [ -f feeds/follow.opml ]; then
            python scripts/update_news.py --output-dir data --window-hours 24 --archive-days 21 --rss-opml feeds/follow.opml --rss-max-feeds "${RSS_MAX_FEEDS:-10}"
          else
            python scripts/update_news.py --output-dir data --window-hours 24 --archive-days 21
          fi

      - name: Commit and push changes
        run: |
          set -euo pipefail
          branch=$(git symbolic-ref --short HEAD)
          if [ "$(git rev-parse HEAD)" != "$GENERATION_BASE" ]; then
            echo "::error::Local checkout changed since generation began"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage only generated public snapshot roots. This includes new,
          # updated, and retention-pruned JSON and HTML resolver files without
          # admitting unrelated untracked repository files.
          git add data/ item/
          # Self-check: fail loudly if anything under either generated root is
          # still unstaged, instead of green-but-stale runs.
          if [ -n "$(git status --porcelain --untracked-files=all -- data/ item/ | grep -v '^[MADRC]' || true)" ]; then
            echo "::error::Generated files under data/ or item/ were not staged:"
            git status --porcelain --untracked-files=all -- data/ item/ | grep -v '^[MADRC]'
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update ai news snapshot"

          max_attempts=3
          attempt=1
          until git push origin "HEAD:refs/heads/$branch"; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::git push failed after $max_attempts attempts"
              exit 1
            fi
            echo "::warning::Push attempt $attempt/$max_attempts failed. Checking the generation base."
            git fetch --no-tags origin "refs/heads/$branch"
            remote_tip=$(git rev-parse --verify FETCH_HEAD)
            if git merge-base --is-ancestor HEAD "$remote_tip"; then
              echo "Snapshot already published"
              exit 0
            fi
            # Only these documentation paths are independent of generation.
            # Unknown inputs, generated roots and rewritten ancestry fail closed.
            if ! git merge-base --is-ancestor "$GENERATION_BASE" "$remote_tip" ||
               ! git diff --quiet --no-ext-diff --ignore-submodules=none "$GENERATION_BASE" "$remote_tip" -- \
                   . ':(top,exclude)README.md' ':(top,glob,exclude)docs/**/*.md'; then
              echo "::error::Generation inputs or ancestry changed remotely. The next refresh must regenerate."
              exit 1
            fi
            if [ "$(git rev-parse HEAD^)" != "$remote_tip" ]; then
              git rebase --onto "$remote_tip" HEAD^
            fi
            attempt=$((attempt + 1))
          done
