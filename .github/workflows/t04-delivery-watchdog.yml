name: T04 delivery deadline watchdog

on:
  schedule:
    # 2026-10-27 10:17, 10:47, 11:17, 11:47 Asia/Taipei.
    # Script rejects future annual repeats and earlier success suppresses mail.
    - cron: "17,47 2,3 27 10 *"
  workflow_dispatch: {}

concurrency:
  group: t04-delivery-watchdog
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  check:
    if: github.repository == 'seisyuku/ai-news-radar_zhtw' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verify a terminal T04 notification or email an overdue alert
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TW_SOURCE_EMAIL_SETTINGS: ${{ secrets.TW_SOURCE_EMAIL_SETTINGS }}
        run: python scripts/t04_delivery_watchdog.py
